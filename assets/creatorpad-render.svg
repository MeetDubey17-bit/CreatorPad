<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">CreatorPad concept render</title>
  <desc id="desc">A concept render of the CreatorPad hardware control pad with an ESP32-S3, OLED display, rotary encoder, and shortcut buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#172233"/>
    </linearGradient>
    <linearGradient id="case" x1="0" x2="1">
      <stop offset="0%" stop-color="#2d3346"/>
      <stop offset="100%" stop-color="#1b2230"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1">
      <stop offset="0%" stop-color="#a8f0ff"/>
      <stop offset="100%" stop-color="#3cd7ff"/>
    </linearGradient>
    <linearGradient id="button" x1="0" x2="1">
      <stop offset="0%" stop-color="#3a455a"/>
      <stop offset="100%" stop-color="#202a3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="140" y="120" width="920" height="470" rx="40" fill="url(#case)"/>

    <rect x="220" y="170" width="430" height="120" rx="18" fill="#0f1725" stroke="#4fd2ff" stroke-width="3"/>
    <rect x="240" y="190" width="390" height="80" rx="12" fill="url(#screen)" opacity="0.85"/>
    <text x="260" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0b1b2a" font-weight="700">CreatorPad</text>
    <text x="260" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#0b1b2a">READY • MODE 1</text>

    <g>
      <circle cx="780" cy="230" r="76" fill="#1a2435" stroke="#9ad6ff" stroke-width="4"/>
      <circle cx="780" cy="230" r="50" fill="#2b3b54"/>
      <circle cx="780" cy="230" r="14" fill="#8fe7ff"/>
      <path d="M780 160 L780 200 M780 260 L780 300 M710 230 L750 230 M810 230 L850 230" stroke="#8fe7ff" stroke-width="6" stroke-linecap="round"/>
      <text x="735" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#dff8ff" font-weight="600">Encoder</text>
    </g>

    <g>
      <rect x="220" y="340" width="120" height="74" rx="18" fill="url(#button)" stroke="#7ad9ff" stroke-width="2"/>
      <text x="245" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#eafcff">⏵</text>

      <rect x="360" y="340" width="120" height="74" rx="18" fill="url(#button)" stroke="#7ad9ff" stroke-width="2"/>
      <text x="385" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#eafcff">✂</text>

      <rect x="500" y="340" width="120" height="74" rx="18" fill="url(#button)" stroke="#7ad9ff" stroke-width="2"/>
      <text x="526" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#eafcff">↶</text>

      <rect x="640" y="340" width="120" height="74" rx="18" fill="url(#button)" stroke="#7ad9ff" stroke-width="2"/>
      <text x="666" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#eafcff">💾</text>

      <rect x="780" y="340" width="120" height="74" rx="18" fill="url(#button)" stroke="#7ad9ff" stroke-width="2"/>
      <text x="809" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#eafcff">⌁</text>

      <rect x="920" y="340" width="120" height="74" rx="18" fill="url(#button)" stroke="#7ad9ff" stroke-width="2"/>
      <text x="948" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#eafcff">◉</text>
    </g>

    <g>
      <rect x="250" y="454" width="120" height="50" rx="12" fill="#0b1320" stroke="#4f6f8e" stroke-width="2"/>
      <rect x="390" y="454" width="120" height="50" rx="12" fill="#0b1320" stroke="#4f6f8e" stroke-width="2"/>
      <rect x="530" y="454" width="120" height="50" rx="12" fill="#0b1320" stroke="#4f6f8e" stroke-width="2"/>
      <circle cx="290" cy="479" r="10" fill="#66d6ff"/>
      <circle cx="430" cy="479" r="10" fill="#66d6ff"/>
      <circle cx="570" cy="479" r="10" fill="#66d6ff"/>
    </g>

    <g>
      <rect x="705" y="448" width="220" height="90" rx="18" fill="#111c2d" stroke="#5bccff" stroke-width="3"/>
      <text x="748" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#dff9ff" font-weight="600">ESP32-S3</text>
      <text x="742" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fefff">USB + IO</text>
    </g>
  </g>
</svg>
