<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- White background -->
  <rect width="1200" height="900" fill="white"/>
  
  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="black">
    CreatorPad - Hardware Schematic Diagram (Prototype)
  </text>
  <text x="600" y="55" font-size="12" text-anchor="middle" fill="red">
    ⚠ UNVERIFIED PROTOTYPE - ESP32-S3 pinout to be confirmed against official datasheet
  </text>
  
  <!-- LEFT SECTION: Push Buttons -->
  <text x="50" y="100" font-size="14" font-weight="bold" fill="black">Push Buttons (GPIO inputs, active low)</text>
  
  <!-- Button symbols and connections -->
  <g id="button-template">
    <!-- SW1 -->
    <circle cx="80" cy="140" r="8" fill="none" stroke="black" stroke-width="2"/>
    <line x1="70" y1="140" x2="50" y2="140" stroke="black" stroke-width="2"/>
    <line x1="90" y1="140" x2="110" y2="140" stroke="black" stroke-width="2"/>
    <text x="30" y="145" font-size="11" fill="black">SW1 (GPIO4)</text>
    <text x="120" y="145" font-size="10" fill="black">Play/Pause</text>
    
    <!-- SW2 -->
    <circle cx="80" cy="180" r="8" fill="none" stroke="black" stroke-width="2"/>
    <line x1="70" y1="180" x2="50" y2="180" stroke="black" stroke-width="2"/>
    <line x1="90" y1="180" x2="110" y2="180" stroke="black" stroke-width="2"/>
    <text x="30" y="185" font-size="11" fill="black">SW2 (GPIO5)</text>
    <text x="120" y="185" font-size="10" fill="black">Cut</text>
    
    <!-- SW3 -->
    <circle cx="80" cy="220" r="8" fill="none" stroke="black" stroke-width="2"/>
    <line x1="70" y1="220" x2="50" y2="220" stroke="black" stroke-width="2"/>
    <line x1="90" y1="220" x2="110" y2="220" stroke="black" stroke-width="2"/>
    <text x="30" y="225" font-size="11" fill="black">SW3 (GPIO6)</text>
    <text x="120" y="225" font-size="10" fill="black">Undo</text>
    
    <!-- SW4 -->
    <circle cx="80" cy="260" r="8" fill="none" stroke="black" stroke-width="2"/>
    <line x1="70" y1="260" x2="50" y2="260" stroke="black" stroke-width="2"/>
    <line x1="90" y1="260" x2="110" y2="260" stroke="black" stroke-width="2"/>
    <text x="30" y="265" font-size="11" fill="black">SW4 (GPIO7)</text>
    <text x="120" y="265" font-size="10" fill="black">Save</text>
    
    <!-- SW5 -->
    <circle cx="80" cy="300" r="8" fill="none" stroke="black" stroke-width="2"/>
    <line x1="70" y1="300" x2="50" y2="300" stroke="black" stroke-width="2"/>
    <line x1="90" y1="300" x2="110" y2="300" stroke="black" stroke-width="2"/>
    <text x="30" y="305" font-size="11" fill="black">SW5 (GPIO15)</text>
    <text x="120" y="305" font-size="10" fill="black">Custom 1</text>
    
    <!-- SW6 -->
    <circle cx="80" cy="340" r="8" fill="none" stroke="black" stroke-width="2"/>
    <line x1="70" y1="340" x2="50" y2="340" stroke="black" stroke-width="2"/>
    <line x1="90" y1="340" x2="110" y2="340" stroke="black" stroke-width="2"/>
    <text x="30" y="345" font-size="11" fill="black">SW6 (GPIO16)</text>
    <text x="120" y="345" font-size="10" fill="black">Custom 2</text>
  </g>
  
  <!-- CENTER SECTION: ESP32-S3 Module -->
  <text x="500" y="100" font-size="14" font-weight="bold" fill="black">ESP32-S3 Development Board (Placeholder)</text>
  <rect x="400" y="120" width="200" height="260" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="145" font-size="12" font-weight="bold" text-anchor="middle" fill="black">ESP32-S3</text>
  <text x="500" y="165" font-size="10" text-anchor="middle" fill="red">(Model TBD)</text>
  
  <!-- GPIO pins (left side) -->
  <line x1="400" y1="190" x2="380" y2="190" stroke="black" stroke-width="2"/>
  <text x="375" y="195" font-size="10" text-anchor="end" fill="black">GPIO4</text>
  
  <line x1="400" y1="210" x2="380" y2="210" stroke="black" stroke-width="2"/>
  <text x="375" y="215" font-size="10" text-anchor="end" fill="black">GPIO5</text>
  
  <line x1="400" y1="230" x2="380" y2="230" stroke="black" stroke-width="2"/>
  <text x="375" y="235" font-size="10" text-anchor="end" fill="black">GPIO6</text>
  
  <line x1="400" y1="250" x2="380" y2="250" stroke="black" stroke-width="2"/>
  <text x="375" y="255" font-size="10" text-anchor="end" fill="black">GPIO7</text>
  
  <line x1="400" y1="270" x2="380" y2="270" stroke="black" stroke-width="2"/>
  <text x="375" y="275" font-size="10" text-anchor="end" fill="black">GPIO15</text>
  
  <line x1="400" y1="290" x2="380" y2="290" stroke="black" stroke-width="2"/>
  <text x="375" y="295" font-size="10" text-anchor="end" fill="black">GPIO16</text>
  
  <!-- I2C pins and LED pin (right side) -->
  <line x1="600" y1="190" x2="620" y2="190" stroke="black" stroke-width="2"/>
  <text x="625" y="195" font-size="10" fill="black">GPIO8 (SDA)</text>
  
  <line x1="600" y1="210" x2="620" y2="210" stroke="black" stroke-width="2"/>
  <text x="625" y="215" font-size="10" fill="black">GPIO9 (SCL)</text>
  
  <line x1="600" y1="230" x2="620" y2="230" stroke="black" stroke-width="2"/>
  <text x="625" y="235" font-size="10" fill="black">GPIO17 (LED)</text>
  
  <!-- Power pins -->
  <line x1="600" y1="270" x2="620" y2="270" stroke="black" stroke-width="2"/>
  <text x="625" y="275" font-size="10" fill="black">3.3V</text>
  
  <line x1="600" y1="290" x2="620" y2="290" stroke="black" stroke-width="2"/>
  <text x="625" y="295" font-size="10" fill="black">GND</text>
  
  <!-- RIGHT SECTION: OLED Display -->
  <text x="850" y="100" font-size="14" font-weight="bold" fill="black">OLED Display (I2C)</text>
  <rect x="800" y="120" width="140" height="100" fill="none" stroke="black" stroke-width="2"/>
  <text x="870" y="145" font-size="11" font-weight="bold" text-anchor="middle" fill="black">OLED</text>
  <text x="870" y="162" font-size="10" text-anchor="middle" fill="black">0.96" 128x64</text>
  <text x="870" y="179" font-size="10" text-anchor="middle" fill="black">SSD1306</text>
  
  <!-- OLED pins -->
  <line x1="800" y1="195" x2="780" y2="195" stroke="black" stroke-width="2"/>
  <text x="775" y="200" font-size="10" text-anchor="end" fill="black">VCC (3.3V)</text>
  
  <line x1="800" y1="210" x2="780" y2="210" stroke="black" stroke-width="2"/>
  <text x="775" y="215" font-size="10" text-anchor="end" fill="black">GND</text>
  
  <line x1="800" y1="225" x2="780" y2="225" stroke="black" stroke-width="2"/>
  <text x="775" y="230" font-size="10" text-anchor="end" fill="black">SDA</text>
  
  <line x1="800" y1="240" x2="780" y2="240" stroke="black" stroke-width="2"/>
  <text x="775" y="245" font-size="10" text-anchor="end" fill="black">SCL</text>
  
  <!-- BOTTOM SECTION: LED and Resistor -->
  <text x="50" y="420" font-size="14" font-weight="bold" fill="black">Status Indicator Circuit</text>
  
  <!-- LED symbol -->
  <polygon points="100,460 85,475 115,475" fill="none" stroke="black" stroke-width="2"/>
  <line x1="100" y1="445" x2="100" y2="460" stroke="black" stroke-width="2"/>
  <text x="80" y="490" font-size="11" fill="black">LED1 (Red)</text>
  
  <!-- Resistor symbol -->
  <rect x="140" y="450" width="30" height="20" fill="none" stroke="black" stroke-width="2"/>
  <text x="155" y="485" font-size="11" text-anchor="middle" fill="black">R1</text>
  <text x="155" y="500" font-size="10" text-anchor="middle" fill="black">220Ω</text>
  
  <!-- Connections: GPIO17 → R1 → LED → GND -->
  <line x1="120" y1="460" x2="140" y2="460" stroke="black" stroke-width="2"/>
  <line x1="170" y1="460" x2="200" y2="460" stroke="black" stroke-width="2"/>
  <line x1="200" y1="460" x2="200" y2="480" stroke="black" stroke-width="2"/>
  <text x="205" y="475" font-size="10" fill="black">to GPIO17</text>
  
  <!-- POWER AND GROUND RAILS -->
  <text x="50" y="560" font-size="14" font-weight="bold" fill="black">Power and Ground Distribution</text>
  
  <line x1="50" y1="580" x2="200" y2="580" stroke="red" stroke-width="3"/>
  <text x="210" y="585" font-size="11" fill="red">+3.3V Rail</text>
  
  <line x1="50" y1="610" x2="200" y2="610" stroke="black" stroke-width="3"/>
  <text x="210" y="615" font-size="11" fill="black">GND Rail</text>
  
  <!-- Connections from ESP32 to power rails -->
  <line x1="620" y1="270" x2="620" y2="580" stroke="red" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="620" y1="290" x2="620" y2="610" stroke="black" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- OLED power connections -->
  <line x1="780" y1="195" x2="750" y2="195" stroke="red" stroke-width="2"/>
  <line x1="750" y1="195" x2="750" y2="580" stroke="red" stroke-width="2"/>
  
  <line x1="780" y1="210" x2="730" y2="210" stroke="black" stroke-width="2"/>
  <line x1="730" y1="210" x2="730" y2="610" stroke="black" stroke-width="2"/>
  
  <!-- Button ground connections (all to GND rail) -->
  <line x1="50" y1="140" x2="20" y2="140" stroke="black" stroke-width="2"/>
  <line x1="20" y1="140" x2="20" y2="610" stroke="black" stroke-width="2"/>
  <line x1="20" y1="610" x2="50" y2="610" stroke="black" stroke-width="2"/>
  
  <!-- Button GPIO connections -->
  <line x1="110" y1="140" x2="150" y2="140" stroke="black" stroke-width="2"/>
  <line x1="150" y1="140" x2="150" y2="190" stroke="black" stroke-width="2"/>
  <line x1="150" y1="190" x2="380" y2="190" stroke="black" stroke-width="2"/>
  
  <line x1="110" y1="180" x2="160" y2="180" stroke="black" stroke-width="2"/>
  <line x1="160" y1="180" x2="160" y2="210" stroke="black" stroke-width="2"/>
  <line x1="160" y1="210" x2="380" y2="210" stroke="black" stroke-width="2"/>
  
  <line x1="110" y1="220" x2="170" y2="220" stroke="black" stroke-width="2"/>
  <line x1="170" y1="220" x2="170" y2="230" stroke="black" stroke-width="2"/>
  <line x1="170" y1="230" x2="380" y2="230" stroke="black" stroke-width="2"/>
  
  <line x1="110" y1="260" x2="180" y2="260" stroke="black" stroke-width="2"/>
  <line x1="180" y1="260" x2="180" y2="250" stroke="black" stroke-width="2"/>
  <line x1="180" y1="250" x2="380" y2="250" stroke="black" stroke-width="2"/>
  
  <line x1="110" y1="300" x2="190" y2="300" stroke="black" stroke-width="2"/>
  <line x1="190" y1="300" x2="190" y2="270" stroke="black" stroke-width="2"/>
  <line x1="190" y1="270" x2="380" y2="270" stroke="black" stroke-width="2"/>
  
  <line x1="110" y1="340" x2="200" y2="340" stroke="black" stroke-width="2"/>
  <line x1="200" y1="340" x2="200" y2="290" stroke="black" stroke-width="2"/>
  <line x1="200" y1="290" x2="380" y2="290" stroke="black" stroke-width="2"/>
  
  <!-- I2C connections -->
  <line x1="620" y1="190" x2="780" y2="225" stroke="blue" stroke-width="2"/>
  <text x="700" y="205" font-size="10" fill="blue">SDA</text>
  
  <line x1="620" y1="210" x2="780" y2="240" stroke="blue" stroke-width="2"/>
  <text x="700" y="225" font-size="10" fill="blue">SCL</text>
  
  <!-- LED connection -->
  <line x1="620" y1="230" x2="200" y2="460" stroke="green" stroke-width="2"/>
  <text x="400" y="340" font-size="10" fill="green">GPIO17</text>
  
  <!-- LEGEND -->
  <text x="50" y="700" font-size="12" font-weight="bold" fill="black">Legend</text>
  <circle cx="60" cy="720" r="5" fill="none" stroke="black" stroke-width="2"/>
  <text x="80" y="725" font-size="11" fill="black">Push Button Switch (Momentary, Active Low)</text>
  
  <circle cx="60" cy="745" r="4" fill="red" stroke="black" stroke-width="1"/>
  <text x="80" y="750" font-size="11" fill="black">Red signal line = +3.3V</text>
  
  <circle cx="60" cy="770" r="4" fill="black" stroke="black" stroke-width="1"/>
  <text x="80" y="775" font-size="11" fill="black">Black signal line = GND (0V)</text>
  
  <circle cx="60" cy="795" r="4" fill="blue" stroke="black" stroke-width="1"/>
  <text x="80" y="800" font-size="11" fill="black">Blue signal line = I2C (SDA/SCL)</text>
  
  <circle cx="60" cy="820" r="4" fill="green" stroke="black" stroke-width="1"/>
  <text x="80" y="825" font-size="11" fill="black">Green signal line = GPIO/Control</text>
  
  <!-- NOTES -->
  <rect x="50" y="840" width="1100" height="50" fill="#fffacd" stroke="red" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="60" y="860" font-size="10" fill="red" font-weight="bold">⚠ PROTOTYPE NOTES:</text>
  <text x="60" y="875" font-size="9" fill="red">• ESP32-S3 board model and exact pinout must be verified against official Espressif datasheet</text>
  <text x="60" y="888" font-size="9" fill="red">• OLED 3.3V supply capability must be confirmed; add decoupling caps if needed</text>
  
</svg>
